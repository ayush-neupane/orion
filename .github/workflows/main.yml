name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8==7.1.1
      - name: Flake8
        working-directory: backend
        run: flake8 app tests

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (fail on any advisory)
        working-directory: backend
        run: |
          pip install pip-audit==2.7.3
          pip-audit --strict -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (fail on critical)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=critical

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion_test_pw
          POSTGRES_DB: orion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Pytest with coverage gate (85%)
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-not-real-0000000000000000
          DATABASE_URL: sqlite:///./orion_ci.db
          RATELIMIT_STORAGE_URI: memory://
          COOKIE_SECURE: "false"
        run: python -m pytest --cov=app --cov-fail-under=85 -q

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env
      - name: Start the full stack
        run: docker compose up --build -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 5
          done
          echo "backend failed to become healthy"; docker compose logs --tail=100; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright tests
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
